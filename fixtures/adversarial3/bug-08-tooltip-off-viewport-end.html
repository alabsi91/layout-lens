<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan</title>
<style>
  body { margin: 0; background: #ffffff; color: #111827;
         font-family: -apple-system, "Segoe UI", Arial, sans-serif; }

  .board { padding: 40px; }
  .board h1 { margin: 0 0 24px; font-size: 24px; line-height: 32px; }

  .card { position: relative; width: 260px; height: 120px; box-sizing: border-box;
          margin-left: 900px; padding: 16px; border-radius: 10px; background: #f8fafc; }
  .card h2 { margin: 0 0 4px; font-size: 15px; line-height: 22px; }
  .card p { margin: 0; font-size: 13px; line-height: 20px; color: #6b7280; }

  /* the planted defect: the hint is anchored 152 into a card that already sits at the
     end of the page, so its 200 of width runs off the screen */
  .tip { position: absolute; top: 128px; left: 152px; width: 200px; box-sizing: border-box;
         padding: 8px 10px; border-radius: 8px; background: #111827; color: #ffffff;
         font-size: 12px; line-height: 18px; }
</style>
</head>
<body>

<div class="board">
  <h1>Plan</h1>

  <div class="card">
    <h2>Team</h2>
    <p>14 seats<br>Renews 3 May</p>
    <div class="tip" id="renew-tip">Renewal is charged to the card ending 4417.</div>
  </div>
</div>

</body>
</html>
