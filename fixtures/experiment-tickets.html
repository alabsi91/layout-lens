<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>حجز تذاكر — الرحلة الأخيرة</title>
    <style>
      :root {
        --page-background: #0d0e12;
        --surface: #171921;
        --surface-raised: #1f222c;
        --seat-available: #414a5e;
        --seat-taken: #2b303c;
        --accent: #f2c45a;
        --accent-ink: #17181d;
        --text-primary: #f4f5f8;
        --text-muted: #a7adbb;
        --hairline: #262a35;
      }

      * {
        box-sizing: border-box;
      }

      button {
        font-family: inherit;
        color: inherit;
      }

      body {
        margin: 0;
        background: var(--page-background);
        color: var(--text-primary);
        font-family: "SF Arabic", "Geeza Pro", "Noto Naskh Arabic", system-ui, sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      .screen-frame {
        display: flex;
        flex-direction: column;
        min-height: 844px;
        padding-bottom: 72px;
      }

      /* top bar */

      .top-bar {
        display: grid;
        grid-template-columns: 40px 1fr 40px;
        align-items: center;
        height: 56px;
        padding: 0 12px;
        border-bottom: 1px solid var(--hairline);
      }

      .icon-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 12px;
        background: var(--surface);
        color: var(--text-primary);
        cursor: pointer;
      }

      .icon-button svg {
        width: 20px;
        height: 20px;
      }

      .top-bar-title {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* days */

      .day-strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 14px 16px;
        scrollbar-width: none;
      }

      .day-strip::-webkit-scrollbar {
        display: none;
      }

      .day-chip {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        width: 56px;
        height: 62px;
        border: 1px solid var(--hairline);
        border-radius: 14px;
        background: var(--surface);
      }

      .day-chip-name {
        font-size: 12px;
        color: var(--text-muted);
      }

      .day-chip-number {
        font-size: 17px;
        font-weight: 600;
        line-height: 1;
      }

      .day-chip.is-selected {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }

      .day-chip.is-selected .day-chip-name {
        color: var(--accent-ink);
      }

      /* showtimes */

      .time-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 0 16px;
      }

      .time-pill {
        height: 38px;
        border: 1px solid var(--hairline);
        border-radius: 19px;
        background: var(--surface);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .time-pill.is-selected {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }

      /* seat map */

      .seat-map {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        margin: 16px;
        padding: 20px 12px;
        border: 1px solid var(--hairline);
        border-radius: 22px;
        background: var(--surface);
      }

      .screen-label {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        width: 230px;
        height: 42px;
        flex: 0 0 auto;
        margin: 0 auto;
        border-top: 2px solid var(--accent);
        border-radius: 60% 60% 0 0 / 26px 26px 0 0;
        background: linear-gradient(to bottom, rgba(242, 196, 90, 0.16), rgba(242, 196, 90, 0));
        color: var(--text-muted);
        font-size: 12px;
        letter-spacing: 0.04em;
        padding-top: 20px;
      }

      .seat-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 332px;
        margin: 0 auto;
      }

      .seat-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .seat-row > * {
        flex: 0 0 auto;
      }

      .row-letter {
        width: 16px;
        margin-inline-end: 8px;
        color: var(--text-muted);
        font-size: 11px;
        text-align: center;
      }

      .aisle {
        width: 14px;
      }

      .seat {
        width: 18px;
        height: 18px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: var(--seat-available);
        cursor: pointer;
      }

      .seat.is-taken {
        background: var(--seat-taken);
        cursor: not-allowed;
      }

      .seat.is-selected {
        background: var(--accent);
      }

      /* legend */

      .legend {
        display: flex;
        justify-content: center;
        gap: 18px;
        padding: 0 16px 22px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-muted);
        font-size: 12px;
      }

      .legend-swatch {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        background: var(--seat-available);
      }

      .legend-swatch.is-taken {
        background: var(--seat-taken);
      }

      .legend-swatch.is-selected {
        background: var(--accent);
      }

      /* summary */

      .summary-card {
        margin: 0 16px 16px;
        padding: 12px;
        border: 1px solid var(--hairline);
        border-radius: 18px;
        background: var(--surface);
      }

      .summary-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .poster-thumb {
        flex: 0 0 auto;
        width: 52px;
        height: 68px;
        border-radius: 10px;
        background: linear-gradient(150deg, #3b3050, #7a4a3a 55%, #d8a15c);
      }

      .summary-lines {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }

      .summary-film {
        font-size: 15px;
        font-weight: 600;
      }

      .summary-meta,
      .summary-seats {
        color: var(--text-muted);
        font-size: 12px;
      }

      .summary-seats strong {
        color: var(--text-primary);
        font-weight: 600;
      }

      .summary-total {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--hairline);
      }

      .summary-total-label {
        color: var(--text-muted);
        font-size: 12px;
      }

      .summary-total-value {
        font-size: 17px;
        font-weight: 700;
      }

      /* pay bar */

      .pay-bar {
        position: fixed;
        inset-inline: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        height: 72px;
        padding: 0 16px;
        border-top: 1px solid var(--hairline);
        background: var(--page-background);
      }

      .pay-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 50px;
        padding: 0 18px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: var(--accent-ink);
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
