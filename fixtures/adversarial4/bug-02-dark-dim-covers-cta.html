<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upgrade</title>
<style>
  :root { color-scheme: light dark; }

  body { margin: 0; background: #ffffff; color: #111827;
         font-family: -apple-system, "Segoe UI", Arial, sans-serif; }

  .page { width: 640px; margin: 0 auto; padding: 64px 0; }
  .page h1 { margin: 0 0 24px; font-size: 24px; line-height: 32px; }

  .card { position: relative; width: 360px; height: 200px; box-sizing: border-box;
          padding: 24px; border-radius: 12px; background: #f6f7f9; }
  .card h2 { margin: 0 0 8px; font-size: 18px; line-height: 26px; }
  .card p { margin: 0 0 20px; font-size: 14px; line-height: 20px; color: #4b5563; }

  .cta { display: block; width: 100%; height: 44px; border: 0; border-radius: 8px;
         background: #2563eb; color: #ffffff; font-size: 15px; font-weight: 600; }

  /* the loading dim is left mounted on purpose, it is transparent once the plans
     have arrived. the dark palette gave it a solid colour instead of a clear one */
  .card-dim { position: absolute; inset: 0; border-radius: 12px; background: transparent; }

  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    .card { background: #161b22; }
    .card p { color: #9aa3b2; }
    .card-dim { background: #0d1117; }
  }
</style>
</head>
<body>

<div class="page">
  <h1>Upgrade your workspace</h1>

  <div class="card">
    <h2>Pro</h2>
    <p>Unlimited history, audit logs and four extra integrations.</p>
    <button class="cta" id="start-trial">Start free trial</button>
    <div class="card-dim" id="card-dim"></div>
  </div>
</div>

</body>
</html>
