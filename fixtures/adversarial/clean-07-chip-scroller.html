<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse by tag</title>
<style>
  body { margin: 0; background: #ffffff; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; }

  .browse { width: 600px; margin: 80px auto 0; }
  .browse h2 { margin: 0 0 12px; font-size: 18px; }

  /* on purpose: more chips than fit, the row scrolls sideways */
  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }

  .chip { flex: 0 0 auto; padding: 7px 14px; border: 1px solid #d1d5db; border-radius: 999px;
          background: #f6f7f9; font-size: 13px; line-height: 18px; white-space: nowrap; }

  .browse-note { margin: 14px 0 0; font-size: 13px; line-height: 20px; color: #4b5563; }
</style>
</head>
<body>

<section class="browse">
  <h2>Browse by tag</h2>

  <div class="chip-row" id="tag-row">
    <span class="chip">Espresso</span>
    <span class="chip">Filter</span>
    <span class="chip">Decaf</span>
    <span class="chip">Single origin</span>
    <span class="chip">Blends</span>
    <span class="chip">Ethiopia</span>
    <span class="chip">Colombia</span>
    <span class="chip">Kenya</span>
    <span class="chip">Brazil</span>
    <span class="chip">Light roast</span>
    <span class="chip">Dark roast</span>
    <span class="chip">Subscriptions</span>
  </div>

  <p class="browse-note">Swipe the row to see the rest.</p>
</section>

</body>
</html>
