<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project members</title>
<style>
  body { margin: 0; background: #ffffff; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; }

  .members { display: flex; align-items: center; gap: 14px;
             width: 420px; margin: 90px auto 0; padding: 16px;
             border: 1px solid #e5e7eb; border-radius: 12px; }

  .stack { padding-left: 10px; font-size: 0; }

  /* on purpose: each circle sits on the one before it */
  .avatar { display: inline-block; width: 34px; height: 34px; margin-left: -10px;
            border: 2px solid #ffffff; border-radius: 50%;
            font-size: 12px; line-height: 34px; text-align: center; color: #1a1a1a; }

  .a1 { background: #c7d2fe; }
  .a2 { background: #bbf7d0; }
  .a3 { background: #fde68a; }
  .a4 { background: #fbcfe8; }

  .members-note { font-size: 13px; line-height: 20px; color: #4b5563; }
</style>
</head>
<body>

<div class="members">
  <div class="stack">
    <span class="avatar a1">PK</span>
    <span class="avatar a2">DR</span>
    <span class="avatar a3">MO</span>
    <span class="avatar a4">JL</span>
  </div>
  <span class="members-note">4 people on Harbour</span>
</div>

</body>
</html>
