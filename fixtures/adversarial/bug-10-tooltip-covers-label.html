<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spend controls</title>
<style>
  body { margin: 0; background: #ffffff; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; }

  .controls { width: 400px; margin: 90px auto 0; }
  .controls h2 { margin: 0 0 18px; font-size: 19px; }

  .field-row { position: relative; }

  .field-label { display: block; width: 240px; margin: 0 0 8px;
                 font-size: 13px; line-height: 20px; font-weight: 700; }

  .field { display: block; width: 100%; box-sizing: border-box; padding: 9px 12px;
           border: 1px solid #9ca3af; border-radius: 6px;
           font-family: inherit; font-size: 14px; line-height: 20px; color: #1a1a1a; background: #ffffff; }

  /* the planted defect: the hint bubble sits on top of the end of the label */
  .tooltip { position: absolute; top: -5px; left: 96px; padding: 5px 9px; border-radius: 6px;
             background: #1a1a1a; color: #ffffff; font-size: 12px; line-height: 16px; white-space: nowrap; }

  .foot { margin: 16px 0 0; font-size: 13px; line-height: 20px; color: #4b5563; }
</style>
</head>
<body>

<section class="controls">
  <h2>Spend controls</h2>

  <div class="field-row">
    <label class="field-label" id="limit-label" for="limit">Monthly spend limit</label>
    <div class="tooltip" id="limit-tip">Applies per card</div>
    <input class="field" id="limit" type="text" value="2,500">
  </div>

  <p class="foot">Charges above the limit are declined until the next cycle.</p>
</section>

</body>
</html>
