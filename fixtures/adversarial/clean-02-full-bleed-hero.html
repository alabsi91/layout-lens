<main class="page">
  <h1>Two weeks on the coast</h1>

  <div class="hero-media" id="hero-media"></div>
  <p class="caption">Low tide at Ravenscar, six in the morning.</p>

  <p class="body-text">The path drops away about a mile past the car park and then there is nothing
  but gorse and the sound of the water below.</p>
  <p class="body-text">We walked it four days running and never met anyone before nine.</p>
