<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trial ending</title>
<style>
  body { margin: 0; background: #f6f7f9; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; }

  .dialog { position: relative; width: 420px; margin: 120px auto 0; padding: 24px;
            border-radius: 12px; background: #ffffff; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); }

  .dialog h2 { margin: 0 40px 8px 0; font-size: 19px; }
  .dialog p { margin: 0 0 20px; font-size: 14px; line-height: 22px; color: #4b5563; }

  /* on purpose: pinned to the corner, not meant to be centred on anything */
  .dialog-close { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0;
                  border: 0; border-radius: 6px; background: #eef2ff; color: #1a1a1a;
                  font-family: inherit; font-size: 15px; line-height: 28px; cursor: pointer; }

  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .btn { padding: 10px 18px; border: 0; border-radius: 6px; font-family: inherit; font-size: 14px; line-height: 20px; }
  .btn-primary { background: #1a56db; color: #ffffff; }
  .btn-quiet { background: #eef2ff; color: #1a1a1a; }
</style>
</head>
<body>

<div class="dialog">
  <button class="dialog-close" id="dialog-close" type="button" aria-label="Close">&times;</button>

  <h2>Your trial ends Friday</h2>
  <p>Add a card now and nothing changes. Your projects stay where they are.</p>

  <div class="dialog-actions">
    <button class="btn btn-quiet" type="button">Remind me</button>
    <button class="btn btn-primary" type="button">Add a card</button>
  </div>
</div>

</body>
</html>
