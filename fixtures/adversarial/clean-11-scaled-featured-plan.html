<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plans</title>
<style>
  body { margin: 0; background: #ffffff; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; }

  .plans { width: 900px; margin: 70px auto 0; }
  .plans h1 { margin: 0 0 24px; font-size: 26px; text-align: center; }

  .plan-row { display: flex; align-items: center; justify-content: center; gap: 24px; }

  .plan-card { display: flex; flex-direction: column; gap: 10px; width: 240px; height: 300px;
               box-sizing: border-box; padding: 24px 20px;
               border: 1px solid #e5e7eb; border-radius: 12px; background: #ffffff; }

  /* on purpose: the middle one is drawn bigger, so it lines up with nothing */
  #plan-pro { transform: scale(1.05); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); }

  .plan-name { margin: 0; font-size: 15px; font-weight: 700; }
  .plan-price { margin: 0; font-size: 30px; }
  .plan-line { margin: 0; font-size: 13px; line-height: 20px; color: #4b5563; }

  .plan-cta { margin-top: auto; padding: 10px 16px; border: 0; border-radius: 6px;
              background: #1a56db; color: #ffffff; font-family: inherit; font-size: 14px; line-height: 20px; }
</style>
</head>
<body>

<section class="plans">
  <h1>Pick a plan</h1>

  <div class="plan-row">
    <div class="plan-card">
      <p class="plan-name">Starter</p>
      <p class="plan-price">$9</p>
      <p class="plan-line">One project, two seats, email support.</p>
      <button class="plan-cta" type="button">Choose Starter</button>
    </div>

    <div class="plan-card" id="plan-pro">
      <p class="plan-name">Pro</p>
      <p class="plan-price">$29</p>
      <p class="plan-line">Ten projects, ten seats, priority support.</p>
      <button class="plan-cta" type="button">Choose Pro</button>
    </div>

    <div class="plan-card">
      <p class="plan-name">Team</p>
      <p class="plan-price">$79</p>
      <p class="plan-line">Everything in Pro, plus audit logs and SSO.</p>
      <button class="plan-cta" type="button">Choose Team</button>
    </div>
  </div>
</section>

</body>
</html>
