<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site footer</title>
<style>
  body { margin: 0; background: #ffffff; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; }

  .page { padding: 40px 40px 0; }
  .page h1 { margin: 0 0 10px; font-size: 26px; }
  .page p { margin: 0 0 40px; max-width: 520px; font-size: 14px; line-height: 22px; color: #4b5563; }

  .site-footer { padding: 24px 40px 40px; border-top: 1px solid #e5e7eb; }

  /* on purpose: read aloud, never drawn */
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
             overflow: hidden; clip: rect(0, 0, 0, 0); clip-path: inset(50%); white-space: nowrap; }

  .footer-links { display: flex; gap: 20px; margin: 0; padding: 0; list-style: none; }
  .footer-links a { font-size: 13px; line-height: 20px; color: #4b5563; text-decoration: none; }
</style>
</head>
<body>

<main class="page">
  <h1>Ravenscar Coffee</h1>
  <p>Roasted on the east coast, shipped on Tuesdays.</p>
</main>

<footer class="site-footer">
  <h2 class="sr-only" id="footer-heading">Footer navigation</h2>
  <ul class="footer-links">
    <li><a href="#">Stockists</a></li>
    <li><a href="#">Wholesale</a></li>
    <li><a href="#">Returns</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</footer>

</body>
</html>
