<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upload your ID</title>
<style>
  body { margin: 0; background: #ffffff; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; }

  .upload { width: 560px; margin: 60px auto 0; }
  .upload h2 { margin: 0 0 6px; font-size: 20px; }
  .upload .hint { margin: 0 0 20px; font-size: 14px; line-height: 22px; color: #4b5563; }

  .slots { display: flex; align-items: flex-start; gap: 20px; }

  .dropzone { display: flex; flex-direction: column; align-items: center; gap: 10px;
              width: 260px; padding: 18px 16px; border: 1px dashed #9ca3af; border-radius: 10px;
              background: #f6f7f9; }

  .dz-icon { width: 32px; height: 32px; border-radius: 6px; background: linear-gradient(135deg, #bfdbfe, #a5b4fc); }
  .dz-label { font-size: 13px; line-height: 20px; color: #4b5563; }

  /* the planted defect: 4 less room under the second one */
  #dz-back { padding-bottom: 14px; }

  .side-note { margin: 18px 0 0; font-size: 13px; line-height: 20px; color: #4b5563; }
</style>
</head>
<body>

<section class="upload">
  <h2>Upload your ID</h2>
  <p class="hint">Both sides, in focus, all four corners visible.</p>

  <div class="slots">
    <div class="dropzone">
      <div class="dz-icon"></div>
      <span class="dz-label">Drag a file here</span>
    </div>
    <div class="dropzone" id="dz-back">
      <div class="dz-icon"></div>
      <span class="dz-label">Drag a file here</span>
    </div>
  </div>

  <p class="side-note">JPEG or PNG, under 8 MB each.</p>
</section>

</body>
</html>
