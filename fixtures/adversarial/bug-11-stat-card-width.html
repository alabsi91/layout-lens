<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<style>
  body { margin: 0; background: #ffffff; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; }

  .board { width: 560px; margin: 60px auto 0; }
  .board h2 { margin: 0 0 16px; font-size: 19px; }

  .board-row { display: flex; align-items: flex-start; gap: 20px; }

  .stat-card { display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
               width: 240px; padding: 18px 16px; border: 1px dashed #9ca3af; border-radius: 10px;
               background: #f6f7f9; }

  .add-icon { width: 20px; height: 20px; border-radius: 4px; background: #d1d5db; }
  .stat-label { font-size: 13px; line-height: 20px; color: #4b5563; }

  /* the planted defect: 3 wider than the one beside it */
  #card-b { width: 243px; }

  .board-note { margin: 18px 0 0; font-size: 13px; line-height: 20px; color: #4b5563; }
</style>
</head>
<body>

<section class="board">
  <h2>Your dashboard</h2>

  <div class="board-row">
    <div class="stat-card">
      <span class="add-icon"></span>
      <span class="stat-label">Add widget</span>
    </div>
    <div class="stat-card" id="card-b">
      <span class="add-icon"></span>
      <span class="stat-label">Add widget</span>
    </div>
  </div>

  <p class="board-note">Widgets refresh every fifteen minutes.</p>
</section>

</body>
</html>
