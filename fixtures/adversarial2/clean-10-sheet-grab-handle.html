<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route</title>
<style>
  body { margin: 0; background: #e7eaef; color: #111827;
         font-family: -apple-system, "Segoe UI", Arial, sans-serif; }

  .map { height: 520px; background-image: linear-gradient(160deg, #dbe6d8, #cddbe6); }

  .sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 320px;
           background: #ffffff; border-radius: 18px 18px 0 0; padding: 10px 20px 24px;
           box-shadow: 0 -8px 24px rgba(15,18,25,.14); }

  /* the drag handle, a 36x4 bar centred at the top of the sheet */
  .sheet-handle { width: 36px; height: 4px; margin: 0 auto 16px; border-radius: 2px;
                  background: #d1d5db; }

  .sheet h1 { margin: 0 0 4px; font-size: 20px; line-height: 26px; }
  .sheet .sub { margin: 0 0 18px; font-size: 13px; line-height: 18px; color: #6b7280; }

  .leg { display: flex; justify-content: space-between; gap: 16px;
         padding: 11px 0; border-top: 1px solid #f3f4f6;
         font-size: 14px; line-height: 20px; }
  .leg span:last-child { color: #6b7280; }
</style>
</head>
<body>

<div class="map"></div>

<section class="sheet" id="route-sheet">
  <div class="sheet-handle" id="sheet-handle"></div>
  <h1>Bremen → Hamburg</h1>
  <p class="sub">1 h 12 min · 118 km · light traffic</p>

  <div class="leg"><span>A27 north</span><span>34 km</span></div>
  <div class="leg"><span>A1 towards Hamburg</span><span>61 km</span></div>
  <div class="leg"><span>B75 into the centre</span><span>23 km</span></div>
</section>

</body>
</html>
