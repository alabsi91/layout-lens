<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوحة التحكم</title>
<style>
  body { margin: 0; background: #ffffff; color: #111827;
         font-family: "Segoe UI", Tahoma, Arial, sans-serif; }

  .shell { display: flex; gap: 32px; padding: 40px; }

  .side-nav { width: 220px; border-inline-start: 1px solid #e5e7eb; }

  .nav-item { position: relative; display: block; padding: 12px 20px;
              font-size: 15px; line-height: 20px; color: #374151; text-decoration: none; }

  /* the rail that marks each row, pinned to the start edge of the item */
  .accent { position: absolute; inset-block: 8px; width: 3px; border-radius: 2px;
            inset-inline-start: 0; background: #d1d5db; }

  .nav-item.is-current { color: #1d4ed8; font-weight: 600; }
  .nav-item.is-current .accent { background: #1d4ed8; }

  /* the planted defect: this rail was pinned to the end edge instead */
  #accent-reports { inset-inline-start: auto; inset-inline-end: 3px; }

  .panel { flex: 1; }
  .panel h1 { margin: 0 0 12px; font-size: 22px; line-height: 30px; }
  .panel p { margin: 0 0 10px; font-size: 15px; line-height: 24px; color: #4b5563; max-width: 60ch; }
</style>
</head>
<body>

<div class="shell">
  <nav class="side-nav">
    <a class="nav-item" href="#"><span class="accent"></span>النظرة العامة</a>
    <a class="nav-item is-current" href="#"><span class="accent" id="accent-reports"></span>التقارير</a>
    <a class="nav-item" href="#"><span class="accent"></span>الفواتير</a>
    <a class="nav-item" href="#"><span class="accent"></span>الفريق</a>
    <a class="nav-item" href="#"><span class="accent"></span>الإعدادات</a>
  </nav>

  <section class="panel">
    <h1>التقارير الشهرية</h1>
    <p>تعرض هذه الصفحة ملخص الأداء لكل شهر مع مقارنة بالشهر السابق.</p>
    <p>اختر فترة زمنية من القائمة لتحديث الأرقام والرسوم البيانية.</p>
  </section>
</div>

</body>
</html>
