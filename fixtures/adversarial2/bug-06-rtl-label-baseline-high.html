<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بيانات الحساب</title>
<style>
  body { margin: 0; background: #f7f8fa; color: #111827;
         font-family: "Segoe UI", Tahoma, Arial, sans-serif; }

  .card { width: 560px; margin: 56px auto; background: #ffffff; border: 1px solid #e5e7eb;
          border-radius: 12px; padding: 24px 28px; }
  .card h1 { margin: 0 0 20px; font-size: 20px; line-height: 28px; }

  .form-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }

  .row-label { flex: 0 0 130px; font-size: 14px; line-height: 20px; color: #374151; }

  .row-input { flex: 1; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px;
               font-size: 14px; line-height: 20px; font-family: inherit; color: #111827;
               background: #ffffff; }

  /* the planted defect: this label rides 3 above the row it belongs to */
  #label-city { position: relative; top: -3px; }

  .card p { margin: 4px 0 0; font-size: 13px; line-height: 20px; color: #6b7280; }
</style>
</head>
<body>

<section class="card">
  <h1>بيانات الحساب</h1>

  <div class="form-row">
    <label class="row-label" for="full-name">الاسم الكامل</label>
    <input class="row-input" id="full-name" value="سارة الحربي">
  </div>

  <div class="form-row">
    <label class="row-label" for="email">البريد الإلكتروني</label>
    <input class="row-input" id="email" value="sara@example.com">
  </div>

  <div class="form-row">
    <label class="row-label" id="label-city" for="city">المدينة</label>
    <input class="row-input" id="city" value="الرياض">
  </div>

  <p>تُستخدم هذه البيانات في الفواتير فقط ولا تظهر للعملاء.</p>
</section>

</body>
</html>
