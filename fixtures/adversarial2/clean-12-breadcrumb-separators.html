<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice 2044</title>
<style>
  body { margin: 0; background: #ffffff; color: #111827;
         font-family: -apple-system, "Segoe UI", Arial, sans-serif; }

  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 24px; }

  /* links and slashes share one line, each sits where the words leave room */
  .breadcrumb { margin-bottom: 14px; font-size: 13px; line-height: 18px; }
  .crumb { color: #2563eb; text-decoration: none; }
  .sep { margin: 0 8px; color: #9ca3af; }
  .crumb-current { color: #6b7280; }

  .wrap h1 { margin: 0 0 8px; font-size: 26px; line-height: 34px; }
  .wrap .meta { margin: 0 0 24px; font-size: 14px; line-height: 20px; color: #6b7280; }

  .lines { width: 100%; border-collapse: collapse; }
  .lines th { text-align: left; font-size: 12px; line-height: 16px; color: #6b7280;
              padding: 8px 0; border-bottom: 1px solid #e5e7eb; }
  .lines td { font-size: 14px; line-height: 20px; padding: 10px 0;
              border-bottom: 1px solid #f3f4f6; }
  .lines .right { text-align: right; }
</style>
</head>
<body>

<div class="wrap">
  <nav class="breadcrumb" id="crumbs" aria-label="Breadcrumb">
    <a class="crumb" href="#">Home</a><span class="sep">/</span><a class="crumb" href="#">Billing</a><span class="sep">/</span><a class="crumb" href="#">Invoices</a><span class="sep">/</span><span class="crumb-current">2044</span>
  </nav>

  <h1>Invoice 2044</h1>
  <p class="meta">Orbit Foods · issued 4 March · due 3 April</p>

  <table class="lines">
    <thead><tr><th>Line</th><th class="right">Amount</th></tr></thead>
    <tbody>
      <tr><td>Platform, March</td><td class="right">1,200.00</td></tr>
      <tr><td>Extra seats (4)</td><td class="right">160.00</td></tr>
      <tr><td>Support retainer</td><td class="right">400.00</td></tr>
    </tbody>
  </table>
</div>

</body>
</html>
