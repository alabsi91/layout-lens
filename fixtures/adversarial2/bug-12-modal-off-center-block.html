<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trips</title>
<style>
  body { margin: 0; background: #ffffff; color: #111827;
         font-family: -apple-system, "Segoe UI", Arial, sans-serif; }

  .head { padding: 20px 16px 8px; }
  .head h1 { margin: 0; font-size: 22px; line-height: 28px; }

  .trip { padding: 14px 16px; border-bottom: 1px solid #f3f4f6; }
  .trip h2 { margin: 0 0 2px; font-size: 15px; line-height: 20px; }
  .trip p { margin: 0; font-size: 13px; line-height: 18px; color: #6b7280; }

  .backdrop { position: fixed; inset: 0; background: rgba(15,18,25,.55); }

  /* the sheet is 180 tall in an 844 viewport, so 332 above and below is centered */
  .modal { position: fixed; left: 20px; right: 20px; height: 180px; box-sizing: border-box;
           background: #ffffff; border-radius: 14px; padding: 20px;
           box-shadow: 0 18px 40px rgba(15,18,25,.28); }

  /* the planted defect: 320 instead of 332 */
  #cancel-modal { top: 320px; }

  .modal h2 { margin: 0 0 8px; font-size: 17px; line-height: 24px; }
  .modal p { margin: 0 0 18px; font-size: 14px; line-height: 20px; color: #4b5563; }

  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; height: 40px; border-radius: 8px; font-size: 14px;
                          font-family: inherit; border: 1px solid #d1d5db; background: #ffffff; }
  .modal-actions .danger { border-color: #b91c1c; background: #b91c1c; color: #ffffff; }
</style>
</head>
<body>

<header class="head"><h1>Trips</h1></header>

<main>
  <article class="trip"><h2>Rotterdam → Bremen</h2><p>Tue 09:40 · 2 stops</p></article>
  <article class="trip"><h2>Bremen → Hamburg</h2><p>Tue 15:05 · direct</p></article>
  <article class="trip"><h2>Hamburg → Aarhus</h2><p>Wed 07:20 · 1 stop</p></article>
</main>

<div class="backdrop"></div>

<div class="modal" id="cancel-modal" role="dialog" aria-modal="true" aria-label="Cancel trip">
  <h2>Cancel this trip?</h2>
  <p>The driver is notified right away and the slot goes back to the pool.</p>
  <div class="modal-actions">
    <button type="button">Keep it</button>
    <button type="button" class="danger">Cancel trip</button>
  </div>
</div>

</body>
</html>
