<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project settings</title>
<style>
  body { margin: 0; background: #ffffff; color: #111827;
         font-family: -apple-system, "Segoe UI", Arial, sans-serif; }

  .wrap { max-width: 820px; margin: 0 auto; padding: 48px 24px; }
  .wrap h1 { margin: 0 0 20px; font-size: 24px; line-height: 32px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #e5e7eb; }

  .tab { position: relative; padding: 12px 16px; font-size: 14px; line-height: 20px;
         color: #6b7280; text-decoration: none; }
  .tab.is-active { color: #111827; font-weight: 600; }

  .tab-underline { position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
                   background: #2563eb; }

  /* the planted defect: the marker runs 2 past the end of its tab */
  #general-underline { right: -2px; }

  .panel { padding: 24px 0; }
  .panel h2 { margin: 0 0 8px; font-size: 16px; line-height: 22px; }
  .panel p { margin: 0 0 16px; font-size: 14px; line-height: 22px; color: #4b5563; max-width: 62ch; }
  .field { display: block; margin-bottom: 14px; font-size: 13px; line-height: 18px; color: #374151; }
  .field input { display: block; margin-top: 6px; width: 320px; padding: 8px 10px;
                 border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>

<div class="wrap">
  <h1>Project settings</h1>

  <nav class="tabs">
    <a class="tab is-active" href="#">General<span class="tab-underline" id="general-underline"></span></a>
    <a class="tab" href="#">Access</a>
    <a class="tab" href="#">Webhooks</a>
    <a class="tab" href="#">Danger zone</a>
  </nav>

  <section class="panel">
    <h2>Basics</h2>
    <p>The project name shows up in every notification and in the billing statement.</p>
    <label class="field">Project name<input value="Atlas migration"></label>
    <label class="field">Slug<input value="atlas-migration"></label>
  </section>
</div>

</body>
</html>
