<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kestrel</title>
<style>
  body { margin: 0; background: #ffffff; color: #111827;
         font-family: -apple-system, "Segoe UI", Arial, sans-serif; }

  .hero { position: relative; max-width: 1000px; margin: 40px auto; padding: 64px 48px;
          background: #eef2ff; border-radius: 20px; }

  /* decoration, tucked into the top corner of the band on purpose */
  .hero-blob { position: absolute; top: 24px; right: 32px; width: 160px; height: 160px;
               border-radius: 50%; z-index: 1;
               background-image: radial-gradient(circle at 30% 30%, #c7d2fe, #818cf8); }

  .hero-copy { position: relative; z-index: 2; max-width: 520px; }
  .hero-copy h1 { margin: 0 0 12px; font-size: 36px; line-height: 44px; }
  .hero-copy p { margin: 0 0 24px; font-size: 16px; line-height: 26px; color: #3f3f46; }

  .cta { display: inline-block; padding: 11px 20px; border-radius: 8px;
         background: #4338ca; color: #ffffff; font-size: 15px; line-height: 20px;
         text-decoration: none; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 48px 64px;
          font-size: 15px; line-height: 26px; color: #52525b; }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-blob" id="hero-blob"></div>
  <div class="hero-copy">
    <h1>Freight that answers back</h1>
    <p>Kestrel tracks every container you booked and tells you about a delay before
       the carrier does.</p>
    <a class="cta" href="#">Book a walkthrough</a>
  </div>
</section>

<p class="wrap">Used by forwarders in eleven countries. No integration work, we read the
   carrier feeds you already pay for.</p>

</body>
</html>
